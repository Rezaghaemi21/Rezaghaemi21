    <text x="34" y="22" fill="#B9B9BE" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">VIENNA · AUSTRIA</text>
