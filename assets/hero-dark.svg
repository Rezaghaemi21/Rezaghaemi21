<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="70" y1="30" x2="1130" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.56" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(938 180) rotate(145) scale(430 360)">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#D4D4D8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="739" y1="362" x2="1115" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#71717A"/>
      <stop offset="0.5" stop-color="#D4D4D8"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .signal { stroke-dasharray: 90 520; animation: signal 4.8s linear infinite; }
      .node { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .node-2 { animation-delay: .55s; }
      .node-3 { animation-delay: 1.1s; }
      .node-4 { animation-delay: 1.65s; }
      .status { animation: status 2.4s ease-in-out infinite; }
      @keyframes signal { to { stroke-dashoffset: -610; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes status { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .signal, .node, .status { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="558" rx="34" fill="url(#bg)" stroke="#242424" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="558" rx="34" fill="url(#glow)"/>

  <g opacity="0.16">
