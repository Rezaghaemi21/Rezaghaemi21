  <text x="72" y="181" fill="#F5F5F7" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="650" letter-spacing="-3.6">Reza Ghaemi</text>
