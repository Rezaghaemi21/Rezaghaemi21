  <text x="74" y="326" fill="#F4F4F5" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="500" letter-spacing="-0.7">I turn complex ideas into</text>
  <text x="74" y="369" fill="#F4F4F5" font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="500" letter-spacing="-0.7">intelligent systems that ship.</text>

